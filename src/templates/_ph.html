{% macro src(p, w=800) %}https://images.unsplash.com/{{ p.id }}?auto=format&fit=crop&w={{ w }}&q=70{% endmacro %}
{% macro bg(p) %}<img class="hbg" src="{{ src(p, 1400) }}" srcset="{{ src(p, 800) }} 800w, {{ src(p, 1400) }} 1400w, {{ src(p, 2000) }} 2000w" sizes="100vw" alt="" fetchpriority="high"><a class="credit" href="{{ p.page }}" target="_blank" rel="noopener nofollow">Foto: {{ p.by }} / Unsplash</a>{% endmacro %}
{% macro thumb(p, il) %}<div class="thumb ph"><img src="{{ src(p, 600) }}" srcset="{{ src(p, 400) }} 400w, {{ src(p, 800) }} 800w" sizes="(max-width:520px) 100vw, 320px" alt="" loading="lazy" width="600" height="375"><span class="badge"><img src="/static/img/il/{{ il }}.svg" alt="" width="60" height="40"></span></div>{% endmacro %}
